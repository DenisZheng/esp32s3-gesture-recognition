name: P1 temporary four-class annotation byte-budget probe
on:
  push:
    branches: [feat/p1-local-review-orchestrator]
permissions:
  contents: read
jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect only four train JSON central directory entries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.hagrid_zip_range inspect \
            --splits train \
            --sources two_up peace peace_inverted two_up_inverted
