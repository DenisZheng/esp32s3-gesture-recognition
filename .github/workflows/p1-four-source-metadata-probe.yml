name: P1 temporary remaining gesture ZIP64 metadata verification

on:
  push:
    branches: [feat/p1-four-source-zip64-baselines]

permissions:
  contents: read

jobs:
  inspect-indexes:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check peace ZIP64 index only
        run: python3 -m scripts.hagrid_image_zip64 inspect --source peace
      - name: Check peace_inverted ZIP64 index only
        run: python3 -m scripts.hagrid_image_zip64 inspect --source peace_inverted
      - name: Check two_up_inverted ZIP64 index only
        run: python3 -m scripts.hagrid_image_zip64 inspect --source two_up_inverted
