name: P1 temporary official HaGRIDv2 annotation provenance comparison
on:
  push:
    branches: [feat/p1-05-dual-source-dataset]
permissions:
  contents: read
jobs:
  compare-annotation-sources-metadata-only:
    if: contains(github.event.head_commit.message, '[probe-ann]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare official README and legacy annotation ZIP HEAD/footer ONLY
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,json,struct
          base="https://rndml-team-cv.obs.ru-moscow-1.hc.sbercloud.ru"
          paths=[
            ("legacy", "/datasets/hagrid/hagrid_dataset_new_554800/annotations.zip"),
            ("official_v2", "/datasets/hagrid_v2/annotations_with_landmarks/annotations.zip"),
          ]
          for name,path in paths:
              try:
                  url=base+path
                  headers={"Accept-Encoding":"identity","User-Agent":"P1-05-OfficialIndex/1"}
                  with urllib.request.urlopen(urllib.request.Request(url,method="HEAD",headers=headers),timeout=45) as h:
                      size=int(h.headers["Content-Length"]);etag=h.headers.get("ETag")
                  start=size-65536
                  req=urllib.request.Request(url,headers=dict(headers,Range=f"bytes={start}-{size-1}"))
                  with urllib.request.urlopen(req,timeout=60) as g:
                      if g.status!=206: raise ValueError("Range ignored")
                      data=g.read(65537)
                      if len(data)!=65536: raise ValueError("Wrong range length")
                  pos=data.rfind(b"PK\x05\x06")
                  if pos<0: raise ValueError("No ZIP EOCD in footer")
                  f=struct.unpack_from("<4s4H2IH",data,pos)
                  print(json.dumps({"label":name,"bytes":size,"etag":etag,"zip_entries_in_EOCD":f[4],"central_directory_bytes":f[5],"central_offset":f[6],"tail_SHA256":hashlib.sha256(data).hexdigest()},sort_keys=True))
              except Exception as exc:
                  print(json.dumps({"label":name,"error_type":type(exc).__name__,"status":getattr(exc,"code",None)},sort_keys=True))
          PY
