name: P1 temporary official ten-source ZIP metadata audit
on:
  push:
    branches: [feat/p1-05-dual-source-dataset]
permissions:
  contents: read
jobs:
  official-image-index-only:
    if: contains(github.event.head_commit.message, '[probe-index]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source: [one, three, four, palm, like, ok, no_gesture, call, dislike]
    steps:
      - uses: actions/checkout@v4
      - name: HEAD and bounded source ZIP64 index only (no JPEG payload)
        env:
          SOURCE: "${{ matrix.source }}"
        run: |
          python3 - <<'PY'
          import json,os
          from scripts import hagrid_image_zip64 as h
          source=os.environ["SOURCE"]
          assert source in {"one","three","four","palm","like","ok","no_gesture","call","dislike"}
          url=h.HOST+"/datasets/hagrid/hagrid_dataset_new_554800/hagrid_dataset/"+source+".zip"
          h.IMAGE_URLS[source]=url
          net=h.HTTPRange(url)
          class ReadOnlyTransport:
              size=net.size
              def get(self,start,end): return net.get(start,end)
          _,report=h.inspect(source,ReadOnlyTransport())
          print(json.dumps(report,sort_keys=True))
          PY
  official-annotation-index-only:
    if: contains(github.event.head_commit.message, '[probe-index]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect compressed size for ten target sources all splits only
        run: |
          python3 - <<'PY'
          from scripts.hagrid_zip_range import fetch_directory
          from scripts.data_contract import SOURCE_TO_INDEX
          meta=fetch_directory()
          for split in ("train","val","test"):
              data=[]
              for source in SOURCE_TO_INDEX:
                  m=meta.get(f"annotations/{split}/{source}.json")
                  if m is None: raise SystemExit("Missing required source metadata")
                  data.append((source,m.compressed,m.uncompressed))
              print("SPLIT",split,"TOTAL_COMPRESSED",sum(x[1] for x in data),"TOTAL_UNCOMPRESSED",sum(x[2] for x in data))
              print("SOURCE_BYTES",data)
          PY

  no-gesture-alternate-official-zip:
    if: contains(github.event.head_commit.message, '[probe-ng]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read published no_gesture ZIP end-directory and central-index only
        run: |
          python3 - <<'PY'
          import hashlib,json,struct
          from scripts import hagrid_image_zip64 as h
          source="no_gesture"
          url=h.HOST+"/datasets/hagrid_v2/hagrid_v2_zip/no_gesture.zip"
          h.IMAGE_URLS[source]=url
          net=h.HTTPRange(url)
          tail=net.get(max(net.size-65536,0),net.size-1)
          end=tail.rfind(b"PK\x05\x06")
          if end<0 or end+22!=len(tail): raise SystemExit("Nonstandard ZIP EOCD")
          sig,disk,cdisk,n_disk,count,cd_bytes,cd_start,comment=struct.unpack_from("<4s4H2IH",tail,end)
          print("zip32_footer",json.dumps({"size":net.size,"count":count,"cd_bytes":cd_bytes,"cd_start":cd_start,"comment":comment}))
          if disk or cdisk or n_disk!=count or comment: raise SystemExit("Nonstandard ZIP")
          if count==65535:
              cd_start,cd_bytes,count=h.parse_zip64_footer(tail,net.size)
          assert 0<cd_bytes<8*1024*1024 and cd_start+cd_bytes<net.size
          central=net.get(cd_start,cd_start+cd_bytes-1)
          data=h.parse_image_index(central,count,source)
          print(json.dumps({"source":source,"source_path":"official_hagrid_v2/hagrid_v2_zip","archive_bytes":net.size,"jpeg_entries":len(data),"index_bytes":cd_bytes,"index_sha256":hashlib.sha256(central).hexdigest()},sort_keys=True))
          PY
