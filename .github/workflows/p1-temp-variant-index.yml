name: P1-06 temporary variant ZIP metadata probe (no JPEG reads)
on:
  push:
    branches: [feat/p1-06-ten-class-visual-review]
permissions:
  contents: read
jobs:
  official-variant-central-directory-only:
    if: contains(github.event.head_commit.message, '[probe-variants]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source: [point, mute, stop, stop_inverted, three2, three3, three_gun]
    steps:
      - uses: actions/checkout@v4
      - name: HEAD, footer, bounded central index only
        env:
          SOURCE: "${{ matrix.source }}"
        run: |
          python3 - <<'PY'
          import hashlib,json,os,struct,urllib.request
          from collections import Counter
          from scripts import hagrid_image_zip64 as h
          source=os.environ["SOURCE"]
          special={"point","three3","three_gun"}
          prefix="/datasets/hagrid_v2/hagrid_v2_zip/" if source in special else "/datasets/hagrid/hagrid_dataset_new_554800/hagrid_dataset/"
          url=h.HOST+prefix+source+".zip"
          headers={"Accept-Encoding":"identity","User-Agent":"P1-06-IndexOnly/1"}
          with urllib.request.urlopen(urllib.request.Request(url,method="HEAD",headers=headers),timeout=50) as f:
              size=int(f.headers["Content-Length"])
          assert 0<size<h.MAX_ARCHIVE_BYTES
          lo=max(0,size-h.TAIL_BYTES)
          req=urllib.request.Request(url,headers=dict(headers,Range=f"bytes={lo}-{size-1}"))
          with urllib.request.urlopen(req,timeout=60) as f:
              assert f.status==206
              tail=f.read(h.TAIL_BYTES+1)
          assert len(tail)==size-lo
          cd_pos,cd_size,count=h.parse_zip_footer(tail,size)
          assert cd_size<=h.MAX_CENTRAL_BYTES
          req=urllib.request.Request(url,headers=dict(headers,Range=f"bytes={cd_pos}-{cd_pos+cd_size-1}"))
          with urllib.request.urlopen(req,timeout=60) as f:
              assert f.status==206
              data=f.read(h.MAX_CENTRAL_BYTES+1)
          assert len(data)==cd_size
          n=0; kinds=Counter();depths=Counter();prefixes=Counter();sample_names=[]
          for i in range(count):
              fields=struct.unpack_from("<4s6H3I5H2I",data,n)
              assert fields[0]==b"PK\x01\x02"
              name_len,ex_len,com_len=fields[10:13]
              name=data[n+46:n+46+name_len].decode("utf-8" if fields[3]&2048 else "cp437")
              n+=46+name_len+ex_len+com_len
              depths[name.count("/")]+=1
              kinds["jpg" if name.endswith(".jpg") else ("folder" if name.endswith("/") else "other")]+=1
              pieces=name.split("/")
              first=pieces[0] if pieces[0] in (source,"__MACOSX","hagrid_dataset") else "root_or_other"
              prefixes[first]+=1
              if len(sample_names)<6: sample_names.append(name if name.endswith("/") else "<redacted JPEG filename>")
          assert n==cd_size
          print(json.dumps({"source":source,"size":size,"count":count,"central_bytes":cd_size,"central_sha256":hashlib.sha256(data).hexdigest(),"depths":dict(depths),"types":dict(kinds),"prefixes":dict(prefixes)},sort_keys=True))
          PY
